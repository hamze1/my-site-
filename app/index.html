<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>دستیار Kyanai</title>
<meta name="description" content="اپلیکیشن دستیار هوشمند فروش Kyanai — چت هوشمند، مدیریت لید و محاسبه‌گر صرفه‌جویی" />
<meta name="theme-color" content="#0D0E17" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icons/icon-192.png" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<style>
  @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap');
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; background:#08090f; font-family:'Vazirmatn', sans-serif; }
  #root { min-height: 100vh; }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 16px; height: 16px; border-radius: 50%;
    background: #2FD5C4; cursor: pointer;
    box-shadow: 0 0 0 4px rgba(47,213,196,0.18);
  }
</style>
</head>
<body>
<div id="root"></div>

<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef } = React;

/* ---------------------------------------------------------
   kyanai.ir brand tokens
   bg:      #0D0E17 → #151827
   accent:  #2FD5C4 (turquoise)
   accent2: #D8AE5E (gold)
--------------------------------------------------------- */

function AppShell({ children }) {
  return (
    <div style={{
      minHeight: "100vh", width: "100%", display: "flex",
      alignItems: "center", justifyContent: "center",
      background: "radial-gradient(circle at 20% 20%, rgba(47,213,196,0.08), transparent 45%), radial-gradient(circle at 80% 85%, rgba(216,174,94,0.06), transparent 45%), #08090f",
      padding: "24px 12px",
    }}>
      <div style={{
        width: 390, height: "min(844px, 96vh)", maxWidth: "100%",
        background: "linear-gradient(180deg, #0D0E17 0%, #151827 100%)",
        borderRadius: 40, border: "10px solid #05060a",
        boxShadow: "0 0 0 1px rgba(47,213,196,0.15), 0 30px 80px rgba(0,0,0,0.6), 0 0 60px rgba(47,213,196,0.08)",
        overflow: "hidden", position: "relative", display: "flex", flexDirection: "column",
      }}>
        <div style={{ position: "absolute", top: 0, left: "50%", transform: "translateX(-50%)", width: 120, height: 22, background: "#05060a", borderRadius: "0 0 16px 16px", zIndex: 20 }} />
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "14px 22px 4px", fontSize: 13, color: "#9DA3B8", direction: "ltr" }}>
          <span>9:41</span>
          <span style={{ display: "flex", gap: 4 }}><span style={{ opacity: .8 }}>4G</span><span>●●●</span></span>
        </div>
        <div style={{ flex: 1, minHeight: 0, display: "flex", flexDirection: "column" }}>{children}</div>
      </div>
    </div>
  );
}

function TopBar({ title, subtitle, icon }) {
  return (
    <div style={{ padding: "10px 20px 16px", display: "flex", alignItems: "center", gap: 12, borderBottom: "1px solid rgba(255,255,255,0.06)" }}>
      <div style={{
        width: 38, height: 38, borderRadius: 12,
        background: "linear-gradient(135deg, rgba(47,213,196,0.18), rgba(216,174,94,0.12))",
        border: "1px solid rgba(47,213,196,0.3)", display: "flex", alignItems: "center", justifyContent: "center",
        color: "#2FD5C4", flexShrink: 0, fontSize: 17,
      }}>{icon}</div>
      <div>
        <div style={{ color: "#F0F2F8", fontWeight: 700, fontSize: 15 }}>{title}</div>
        <div style={{ color: "#7F869C", fontSize: 12, marginTop: 1 }}>{subtitle}</div>
      </div>
    </div>
  );
}

/* ---------------- Chat screen ---------------- */

const CHAT_SCRIPT = [
  { userText: "سلام، قیمت اتوماسیون فروش چقدره؟", botText: "سلام 👋 اتوماسیون فروش از ۱۰ میلیون تومان شروع می‌شه و بسته به تعداد پیام روزانه‌تون متغیره. چند تا سوال کوتاه بپرسم تا دقیق‌تر راهنماییتون کنم؟", chips: ["حتماً بپرس", "فقط رنج قیمتی رو بگو"] },
  { userText: "حتماً بپرس", botText: "عالیه. روزانه تقریباً چند پیام مشتری (اینستاگرام/بله/سایت) دریافت می‌کنید؟", chips: ["زیر ۲۰ پیام", "۲۰ تا ۱۰۰ پیام", "بیش از ۱۰۰ پیام"] },
  { userText: "۲۰ تا ۱۰۰ پیام", botText: "متوجه شدم — برای این حجم، پکیج اتوماسیون فروش (از ۱۰ میلیون تومان، تحویل ۱-۲ هفته) دقیقاً مناسبه. می‌خواید نمونه گفتگوی زنده رو ببینید یا مستقیم با حمزه صحبت کنید؟", chips: ["نمونه گفتگو رو ببینم", "با حمزه صحبت کنم"] },
  { userText: "با حمزه صحبت کنم", botText: "چشم! لیدتون ثبت شد ✅ حمزه به‌زودی از طریق بله باهاتون تماس می‌گیره. ممنون از وقتتون 🙏", chips: [] },
];

function TypingDots() {
  return (
    <div style={{ display: "flex", gap: 4, padding: "10px 14px" }}>
      {[0,1,2].map(i => <span key={i} style={{ width:6, height:6, borderRadius:"50%", background:"#2FD5C4", display:"inline-block", animation:`kyanaiDot 1.1s ${i*0.15}s infinite ease-in-out` }} />)}
    </div>
  );
}

function ChatScreen() {
  const [step, setStep] = useState(0);
  const [messages, setMessages] = useState([{ from: "bot", text: "سلام 👋 من دستیار هوشمند Kyanai هستم. چطور می‌تونم کمکتون کنم؟" }]);
  const [typing, setTyping] = useState(false);
  const scrollRef = useRef(null);

  useEffect(() => { if (scrollRef.current) scrollRef.current.scrollTop = scrollRef.current.scrollHeight; }, [messages, typing]);

  const handleChip = (label) => {
    const scripted = CHAT_SCRIPT[step];
    if (!scripted) return;
    setMessages(m => [...m, { from: "user", text: label }]);
    setTyping(true);
    setTimeout(() => {
      setTyping(false);
      setMessages(m => [...m, { from: "bot", text: scripted.botText }]);
      setStep(s => s + 1);
    }, 850);
  };

  const currentChips = CHAT_SCRIPT[step]?.chips || [];
  const finished = step >= CHAT_SCRIPT.length;

  return (
    <React.Fragment>
      <TopBar title="دستیار هوشمند Kyanai" subtitle={typing ? "در حال تایپ..." : "آنلاین · معمولاً سریع پاسخ می‌دهد"} icon="✨" />
      <div ref={scrollRef} style={{ flex: 1, overflowY: "auto", padding: "16px 16px 8px", display: "flex", flexDirection: "column", gap: 10 }}>
        {messages.map((m, i) => (
          <div key={i} style={{
            alignSelf: m.from === "bot" ? "flex-start" : "flex-end", maxWidth: "78%",
            background: m.from === "bot" ? "rgba(255,255,255,0.06)" : "linear-gradient(135deg, #2FD5C4, #23A99B)",
            color: m.from === "bot" ? "#E7E9F2" : "#08110F",
            padding: "10px 14px", borderRadius: m.from === "bot" ? "4px 16px 16px 16px" : "16px 4px 16px 16px",
            fontSize: 13.5, lineHeight: 1.7, border: m.from === "bot" ? "1px solid rgba(255,255,255,0.08)" : "none",
          }}>{m.text}</div>
        ))}
        {typing && <div style={{ alignSelf: "flex-start", background: "rgba(255,255,255,0.06)", borderRadius: 16, border: "1px solid rgba(255,255,255,0.08)" }}><TypingDots /></div>}
        {finished && !typing && (
          <div style={{ alignSelf: "center", marginTop: 6, fontSize: 11.5, color: "#7F869C" }}>✓ گفتگو ثبت شد — این یک دموی نمونه‌کار است</div>
        )}
      </div>
      <div style={{ padding: "10px 16px 18px" }}>
        {!finished && currentChips.length > 0 && (
          <div style={{ display: "flex", flexWrap: "wrap", gap: 8, marginBottom: 10 }}>
            {currentChips.map(c => (
              <button key={c} onClick={() => handleChip(c)} disabled={typing} style={{
                background: "rgba(47,213,196,0.1)", border: "1px solid rgba(47,213,196,0.35)", color: "#2FD5C4",
                fontFamily: "inherit", fontSize: 12.5, borderRadius: 100, padding: "8px 14px",
                cursor: typing ? "default" : "pointer",
              }}>{c}</button>
            ))}
          </div>
        )}
        <div style={{ display: "flex", alignItems: "center", gap: 8, background: "rgba(255,255,255,0.05)", border: "1px solid rgba(255,255,255,0.08)", borderRadius: 100, padding: "6px 6px 6px 14px" }}>
          <input placeholder="پیام خود را بنویسید..." disabled style={{ flex: 1, background: "transparent", border: "none", outline: "none", color: "#E7E9F2", fontFamily: "inherit", fontSize: 13 }} />
          <div style={{ width: 34, height: 34, borderRadius: "50%", background: "linear-gradient(135deg, #2FD5C4, #23A99B)", display: "flex", alignItems: "center", justifyContent: "center", color: "#08110F", flexShrink: 0 }}>➤</div>
        </div>
      </div>
    </React.Fragment>
  );
}

/* ---------------- Leads / CRM screen ---------------- */

const STATUS_FLOW = ["جدید", "در حال پیگیری", "تبدیل‌شده"];
const STATUS_COLOR = { "جدید": "#D8AE5E", "در حال پیگیری": "#6FB8FF", "تبدیل‌شده": "#2FD5C4" };
const INITIAL_LEADS = [
  { id: 1, name: "امیر رضایی", service: "اتوماسیون فروش", phone: "0912xxxxxxx", status: "جدید" },
  { id: 2, name: "سارا محمدی", service: "طراحی وب‌سایت", phone: "0935xxxxxxx", status: "در حال پیگیری" },
  { id: 3, name: "رضا کریمی", service: "مشاوره هوش مصنوعی", phone: "0918xxxxxxx", status: "تبدیل‌شده" },
  { id: 4, name: "نیلوفر احمدی", service: "دیجیتال مارکتینگ", phone: "0901xxxxxxx", status: "جدید" },
];

function LeadsScreen() {
  const [leads, setLeads] = useState(INITIAL_LEADS);
  const [openId, setOpenId] = useState(null);

  const advanceStatus = (id) => {
    setLeads(prev => prev.map(l => {
      if (l.id !== id) return l;
      const idx = STATUS_FLOW.indexOf(l.status);
      return { ...l, status: STATUS_FLOW[Math.min(idx + 1, STATUS_FLOW.length - 1)] };
    }));
  };

  const counts = STATUS_FLOW.map(s => leads.filter(l => l.status === s).length);

  return (
    <React.Fragment>
      <TopBar title="لیدها" subtitle={`${leads.length} مخاطب — به‌روزرسانی زنده`} icon="👥" />
      <div style={{ display: "flex", gap: 8, padding: "12px 16px 4px" }}>
        {STATUS_FLOW.map((s, i) => (
          <div key={s} style={{ flex: 1, textAlign: "center", background: "rgba(255,255,255,0.04)", border: `1px solid ${STATUS_COLOR[s]}33`, borderRadius: 10, padding: "8px 4px" }}>
            <div style={{ fontSize: 16, fontWeight: 800, color: STATUS_COLOR[s] }}>{counts[i]}</div>
            <div style={{ fontSize: 10, color: "#7F869C", marginTop: 2 }}>{s}</div>
          </div>
        ))}
      </div>
      <div style={{ flex: 1, overflowY: "auto", padding: "12px 16px" }}>
        {leads.map(lead => {
          const open = openId === lead.id;
          return (
            <div key={lead.id} onClick={() => setOpenId(open ? null : lead.id)} style={{
              background: "rgba(255,255,255,0.045)", border: "1px solid rgba(255,255,255,0.08)",
              borderRadius: 14, padding: "13px 14px", marginBottom: 10, cursor: "pointer",
            }}>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                <div>
                  <div style={{ color: "#F0F2F8", fontWeight: 600, fontSize: 13.5 }}>{lead.name}</div>
                  <div style={{ color: "#7F869C", fontSize: 12, marginTop: 3 }}>{lead.service}</div>
                </div>
                <span style={{ fontSize: 11, padding: "4px 10px", borderRadius: 100, color: STATUS_COLOR[lead.status], background: `${STATUS_COLOR[lead.status]}1A`, border: `1px solid ${STATUS_COLOR[lead.status]}55`, whiteSpace: "nowrap" }}>{lead.status}</span>
              </div>
              {open && (
                <div style={{ marginTop: 12, paddingTop: 12, borderTop: "1px solid rgba(255,255,255,0.07)" }}>
                  <div style={{ display: "flex", alignItems: "center", gap: 8, color: "#9DA3B8", fontSize: 12.5, marginBottom: 12, direction: "ltr", justifyContent: "flex-end" }}>
                    <span>{lead.phone}</span><span>📞</span>
                  </div>
                  <button onClick={(e) => { e.stopPropagation(); advanceStatus(lead.id); }} disabled={lead.status === "تبدیل‌شده"} style={{
                    width: "100%", padding: "9px", borderRadius: 10, border: "none", fontFamily: "inherit", fontSize: 12.5, fontWeight: 600,
                    cursor: lead.status === "تبدیل‌شده" ? "default" : "pointer",
                    background: lead.status === "تبدیل‌شده" ? "rgba(255,255,255,0.06)" : "linear-gradient(135deg, #2FD5C4, #23A99B)",
                    color: lead.status === "تبدیل‌شده" ? "#7F869C" : "#08110F",
                  }}>{lead.status === "تبدیل‌شده" ? "پرونده بسته شد ✓" : "انتقال به مرحله بعد ←"}</button>
                </div>
              )}
            </div>
          );
        })}
      </div>
    </React.Fragment>
  );
}

/* ---------------- ROI Calculator — single synced gauge ---------------- */

function RadialGauge({ percent, size = 168, stroke = 14 }) {
  const r = (size - stroke) / 2;
  const circumference = 2 * Math.PI * r;
  const offset = circumference * (1 - percent / 100);

  return (
    <div style={{ position: "relative", width: size, height: size, margin: "0 auto" }}>
      <svg width={size} height={size} style={{ transform: "rotate(-90deg)" }}>
        <circle cx={size/2} cy={size/2} r={r} fill="none" stroke="rgba(255,255,255,0.07)" strokeWidth={stroke} />
        <circle
          cx={size/2} cy={size/2} r={r} fill="none"
          stroke="url(#kyanaiGaugeGrad)" strokeWidth={stroke} strokeLinecap="round"
          strokeDasharray={circumference} strokeDashoffset={offset}
          style={{ transition: "stroke-dashoffset .45s cubic-bezier(.4,0,.2,1)" }}
        />
        <defs>
          <linearGradient id="kyanaiGaugeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stopColor="#2FD5C4" />
            <stop offset="100%" stopColor="#D8AE5E" />
          </linearGradient>
        </defs>
      </svg>
      <div style={{ position: "absolute", inset: 0, display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center" }}>
        <div style={{ fontSize: 30, fontWeight: 800, color: "#F0F2F8", fontFamily: "monospace" }}>{percent}%</div>
        <div style={{ fontSize: 10.5, color: "#7F869C", marginTop: 2 }}>اتوماسیون‌پذیر</div>
      </div>
    </div>
  );
}

function Slider({ label, value, min, max, step, onChange, unit }) {
  const pct = ((value - min) / (max - min)) * 100;
  return (
    <div style={{ marginBottom: 22 }}>
      <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 10 }}>
        <span style={{ fontSize: 13, color: "#C7CBDA" }}>{label}</span>
        <span style={{ fontSize: 13, fontWeight: 700, color: "#2FD5C4", fontFamily: "monospace" }}>{value}{unit}</span>
      </div>
      <input type="range" min={min} max={max} step={step} value={value} onChange={(e) => onChange(Number(e.target.value))}
        style={{ width: "100%", background: `linear-gradient(90deg, #2FD5C4 ${pct}%, rgba(255,255,255,0.1) ${pct}%)`, height: 4, borderRadius: 4, appearance: "none", outline: "none" }} />
    </div>
  );
}

function CalculatorScreen() {
  const [messagesPerDay, setMessagesPerDay] = useState(50);
  const [minutesPerMsg, setMinutesPerMsg] = useState(4);

  // Single source of truth: every displayed number derives from this one score,
  // so the gauge and the two result numbers can never fall out of sync.
  const impactScore = Math.min(96, Math.round(((messagesPerDay / 300) * 55 + (minutesPerMsg / 15) * 45)));
  const hoursPerMonthSaved = Math.round(((messagesPerDay * minutesPerMsg * 30) / 60) * (impactScore / 100));
  const extraLeadsPerMonth = Math.round(messagesPerDay * 0.15 * 30 * (impactScore / 100) * 0.25);

  return (
    <React.Fragment>
      <TopBar title="محاسبه‌گر صرفه‌جویی" subtitle="تخمین اثر اتوماسیون روی کسب‌وکار شما" icon="🧮" />
      <div style={{ flex: 1, overflowY: "auto", padding: "20px 20px" }}>
        <RadialGauge percent={impactScore} />

        <div style={{ marginTop: 26 }}>
          <Slider label="تعداد پیام مشتری در روز" value={messagesPerDay} min={10} max={300} step={5} onChange={setMessagesPerDay} unit="" />
          <Slider label="زمان پاسخ به هر پیام" value={minutesPerMsg} min={1} max={15} step={1} onChange={setMinutesPerMsg} unit=" دقیقه" />
        </div>

        <div style={{ borderRadius: 16, padding: "16px 18px", background: "linear-gradient(135deg, rgba(47,213,196,0.1), rgba(216,174,94,0.06))", border: "1px solid rgba(47,213,196,0.28)" }}>
          <div style={{ display: "flex", alignItems: "center", gap: 8, color: "#2FD5C4", fontSize: 12.5, marginBottom: 4 }}>📈 نتیجه تخمینی ماهانه</div>
          <div style={{ display: "flex", justifyContent: "space-between", marginTop: 14 }}>
            <div>
              <div style={{ fontSize: 24, fontWeight: 800, color: "#F0F2F8" }}>{hoursPerMonthSaved}</div>
              <div style={{ fontSize: 11.5, color: "#9DA3B8", marginTop: 2 }}>ساعت صرفه‌جویی‌شده</div>
            </div>
            <div style={{ textAlign: "left" }}>
              <div style={{ fontSize: 24, fontWeight: 800, color: "#D8AE5E" }}>+{extraLeadsPerMonth}</div>
              <div style={{ fontSize: 11.5, color: "#9DA3B8", marginTop: 2 }}>لید بیشتر</div>
            </div>
          </div>
        </div>

        <div style={{ marginTop: 16, display: "flex", alignItems: "flex-start", gap: 8, color: "#7F869C", fontSize: 11.5, lineHeight: 1.8 }}>
          <span>⏱</span>
          <span>این عدد یک برآورد ساده است؛ برای محاسبه دقیق‌تر متناسب با کسب‌وکارتان، یک مشاوره رایگان رزرو کنید.</span>
        </div>
      </div>
    </React.Fragment>
  );
}

/* ---------------- Root app ---------------- */

const TABS = [
  { key: "chat", label: "چت هوشمند", icon: "💬" },
  { key: "leads", label: "لیدها", icon: "👥" },
  { key: "calc", label: "محاسبه‌گر", icon: "🧮" },
];

function KyanaiApp() {
  const [tab, setTab] = useState("chat");
  return (
    <AppShell>
      <div style={{ flex: 1, minHeight: 0, display: "flex", flexDirection: "column" }}>
        {tab === "chat" && <ChatScreen />}
        {tab === "leads" && <LeadsScreen />}
        {tab === "calc" && <CalculatorScreen />}
      </div>
      <div style={{ display: "flex", borderTop: "1px solid rgba(255,255,255,0.07)", background: "rgba(8,9,15,0.6)", padding: "8px 10px calc(env(safe-area-inset-bottom, 0px) + 10px)" }}>
        {TABS.map(({ key, label, icon }) => {
          const active = tab === key;
          return (
            <button key={key} onClick={() => setTab(key)} style={{
              flex: 1, background: "none", border: "none", display: "flex", flexDirection: "column",
              alignItems: "center", gap: 4, padding: "6px 0", cursor: "pointer",
              color: active ? "#2FD5C4" : "#6B7186", fontFamily: "inherit",
            }}>
              <span style={{ fontSize: 18 }}>{icon}</span>
              <span style={{ fontSize: 10.5, fontWeight: active ? 700 : 500 }}>{label}</span>
            </button>
          );
        })}
      </div>
    </AppShell>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<KyanaiApp />);
</script>

<style>
@keyframes kyanaiDot { 0%,80%,100%{opacity:.25;transform:translateY(0)} 40%{opacity:1;transform:translateY(-3px)} }
</style>

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
</script>
</body>
</html>
